<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Honey &amp; Fire — Instagram @ The Riff (1080×1350)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Oswald:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #7a2fb0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  /* IG feed-post 4:5 — 1080×1350 native. Summer palette: Instagram-logo
     gradient (yellow bottom-left → magenta → purple top-right). White text,
     the way the IG glyph sits on the gradient. A soft bottom scrim keeps the
     lower text legible over the brighter orange/yellow zone. */
  .poster {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(58,20,86,0.12) 0%, rgba(58,20,86,0) 55%, rgba(46,12,64,0.34) 100%),
      url("images/hero-bg-portrait-summer.jpg?v=e867fe0") center / cover no-repeat,
      #7a2fb0;
    color: #ffffff;
    font-family: 'Oswald', sans-serif;
  }

  /* Top badge */
  .top-badge {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .top-badge span {
    display: inline-block;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.7);
    padding: 8px 24px;
    border-radius: 2px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.25);
  }

  /* Singer portraits */
  .singers {
    position: absolute;
    top: 104px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    z-index: 3;
  }
  .singer {
    width: 300px;
    height: 356px;
    object-fit: cover;
    border-radius: 4px;
    border: 4px solid #ffffff;
    box-shadow: 0 10px 44px rgba(60,10,80,0.45);
    display: block;
  }
  .singer-honey { object-position: center 12%; }
  .singer-fire  { object-position: center 18%; transform: scaleX(-1); }

  /* Musician portraits — row of 4 circles under the singers. */
  .musicians {
    position: absolute;
    top: 486px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 40px;
    z-index: 3;
  }
  .musician-photo {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.95);
    box-shadow: 0 6px 22px rgba(60,10,80,0.45);
    display: block;
  }

  /* Band name */
  .band-name {
    position: absolute;
    top: 636px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 118px;
    line-height: 1;
    letter-spacing: -2px;
    color: #ffffff;
    text-shadow: 0 3px 22px rgba(60,10,80,0.45), 0 2px 6px rgba(0,0,0,0.3);
    z-index: 5;
  }
  .band-name .amp { font-style: italic; }

  .tagline {
    position: absolute;
    top: 770px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 22px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: 14px;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    z-index: 5;
  }

  /* Divider */
  .divider {
    position: absolute;
    top: 800px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 18px;
    width: 540px;
    z-index: 5;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.85), transparent);
  }

  /* Date */
  .date-block {
    position: absolute;
    top: 900px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    text-shadow: 0 2px 12px rgba(0,0,0,0.32);
  }
  .date-day {
    font-size: 26px;
    line-height: 1;
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
    display: block;
    margin-bottom: 14px;
  }
  .date-main {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    line-height: 1;
  }
  .date-number {
    font-weight: 700;
    font-size: 118px;
    line-height: 1;
    color: #ffffff;
    letter-spacing: -3px;
  }
  .date-month {
    font-weight: 700;
    font-size: 44px;
    line-height: 1;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #ffffff;
  }
  .date-time {
    margin-top: 16px;
    font-size: 24px;
    line-height: 1;
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }

  /* Venue */
  .venue {
    position: absolute;
    top: 1150px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    text-shadow: 0 2px 12px rgba(0,0,0,0.38);
  }
  .venue-name {
    font-size: 48px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #ffffff;
  }
  .venue-address {
    margin-top: 14px;
    font-size: 20px;
    line-height: 1;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }

  /* Bottom-left: Instagram handle. Top-anchored so the headless
     screenshot can't shave the line off. */
  .social-badge {
    position: absolute;
    top: 1286px;
    left: 70px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .social-badge svg { width: 34px; height: 34px; flex-shrink: 0; color: #ffffff; }
  .social-handle {
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.95);
    line-height: 1;
  }

  /* Bottom-right: The Riff logo above the WhatsApp prenotazioni number.
     column-reverse keeps DOM order link → logo while showing the logo on
     top; top-anchored like .social-badge. */
  .venue-badge {
    position: absolute;
    top: 1150px;
    right: 70px;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 10px;
    z-index: 10;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .venue-contact { text-decoration: none; text-align: center; color: inherit; }
  .venue-info-label {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .venue-info-number {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 36px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: #ffffff;
    line-height: 1.1;
  }
  .venue-info-number .wa-icon-small { width: 38px; height: 38px; flex-shrink: 0; }
  .venue-logo {
    width: 96px;
    height: 96px;
    border-radius: 12px;
    object-fit: cover;
    opacity: 0.98;
    filter: drop-shadow(0 0 10px rgba(60,10,80,0.5));
  }
</style>
</head>
<body>
<div class="poster">

  <div class="top-badge"><span>Una serata con</span></div>

  <div class="singers">
    <img class="singer singer-honey" src="images/fulls/08.jpg?v=e867fe0" alt="Honey – Francesca" />
    <img class="singer singer-fire"  src="images/fulls/09.jpg?v=e867fe0" alt="Fire – Giorgia" />

    <img class="musician-photo" src="images/members/mario.png?v=e867fe0" alt="Mario – Basso" />

  <h1 class="band-name">Honey <span class="amp">&amp;</span> <span class="fire">Fire</span></h1>

  </div>

  <div class="venue">
    <div class="venue-name">The Riff Live Music</div>
    <div class="venue-address">Via Portuense 1453/B &middot; 00148 Roma (RM)</div>
  </div>

</div>
</body>
